# ==============================
# Application
# ==============================
spring.application.name=backend
server.port=${PORT:8080}      # Railway injecte automatiquement le PORT
server.address=0.0.0.0         # Écoute sur toutes les interfaces

# ==============================
# Connexion à la base PostgreSQL Railway
# ==============================
spring.datasource.url=jdbc:postgresql://<RAILWAY_HOST>:<RAILWAY_PORT>/<RAILWAY_DATABASE>
spring.datasource.username=<RAILWAY_USERNAME>
spring.datasource.password=<RAILWAY_PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# Hibernate / JPA
# ==============================
spring.jpa.hibernate.ddl-auto=none  # On ne touche pas à la DB, initdb.sql gère tout
spring.jpa.show-sql=true            # Affiche les requêtes SQL dans les logs
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==============================
# JWT Configuration
# ==============================
jwt.secret=KJH87f98sd76FSD7f8sd!@#DebateArena#123kldjsf98DSF7
